<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructuring</title>
</head>
<body>
    <h1>Destructuring com objetos</h1>

    <h2>Podemos definir variáveis com propriedades do objeto com 
        uma notação diferente, chamada destructuring.
    </h2>
    
</body>

<script>
    let obj = {
        rodas : 4,
        portas: 4,
        tetosolar: true,
        motor: '2.0'
    }

    const {rodas: vRodas, portas: vPortas, tetosolar: vTetoSolar, motor: vMotor} = obj;

    console.log(vRodas);
    console.log(vPortas);
</script>
</html>
