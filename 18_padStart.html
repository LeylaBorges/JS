<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padStart</title>
</head>
<body>
    <h1> Método de string: padStart</h1>

    <h2>Inserir caracteres antes da string</h2>
    
</body>

<script>
    let sku = "34";

    console.log(sku.padStart(6, "0"));

    let sku2 = "7348";

    console.log(sku2.padStart(6, "0"));
</script>
</html>
