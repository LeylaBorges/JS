<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push e  pop</title>
</head>
<body>
    <h1> Push e pop</h1>
    <h2> adiciona e remove elemento no final do array</h2>
</body>

<script>
     let nomes = [ "Leyla", " Lino", "Creusa"];

     let elemenoRemovido = nomes.pop();

     console.log(elemenoRemovido);
     console.log(nomes);

     nomes.push('Frajola');
     console.log(nomes);
</script>
</html>
