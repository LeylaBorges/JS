<script>
    let pessoa = {
        nome: "Leyla"
    }

    let pessoa2 = pessoa;

        nome: "Matheus"
    }

    console.log(pessoa == pessoa2);
    console.log(pessoa3 == pessoa);
    console.log(pessoa3 == pessoa2);

    pessoa2.nome = "Ana";

    console.log(pessoa.nome);

    pessoa.nome = "Maria";

    console.log(pessoa2.nome);
