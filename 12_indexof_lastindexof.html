<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index e lastIndexof</title>
</head>
<body>
    <h1> Index e lastIndexof</h1>

    <h2> indexOf : encontra o índice de um determinado elemento
        <br>
        lastIndexof = encontrar o último índice de um elemento.
    </h2>
</body>
<script>
    let nums = [5,6,2,4,9,6,2];

    console.log(nums.indexOf(2));

    console.log(nums.lastIndexOf(2));
</script>
</html>
