<!DOCTYPE html>
<html lang="en">
<head>

    <title>Includes</title>
</head>
<body>
    <h1> Includes</h1>

    <h2> Verificar se o array tem um determinado elemento.</h2>
    
</body>

<script>
    let carros = ["BMW", "Fiat", "VW", "Renault", "Audi"];

    console.log(carros.includes("Fiat"));
    console.log(carros.includes("Ford"));
</script>
