<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructuring com array</title>
</head>
<body>
    <h1> Destructuring com array</h1>

    <h2>
        Podemos definir variáveis com os valores de um array
        utilizando o destructuring;
    </h2>
</body>
<script>
    let numeros = [2,4,5,8];

    let [num1, num2, num3, num4] = numeros;

    console.log(num1);
    console.log(num2);
</script>
</html>
