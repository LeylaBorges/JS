<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foreach</title>
</head>
<body>
    <h1> Foreach</h1>

    <h2>
        Itera cada elemento do array.
    </h2>
    
</body>

<script>
    let nomes = ["Leyla", "Lygia", "Luiza", "Luiz"];

    nomes.forEach(nome => {
        console.log("O nome é " + nome);
    });
</script>
</html>
