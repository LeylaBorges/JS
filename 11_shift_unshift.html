<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift e unshift</title>
</head>
<body>
    <h1>
        Shift e unshift
    </h1>

    <h2>
        Remove ou adicona o primeiro elemento do array
    </h2>
    
</body>

<script>
    let carros = ["Hb20", "Corolla" , "Civic"];

    let removerPrimeiroCarro = carros.shift();

    console.log(removerPrimeiroCarro);
    console.log(carros);

    carros.unshift("Tiggo 7");

    console.log(carros);
    console.log(carros[0]);
</script>
</html>
